name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check the server module
        run: ./gradlew :server:check --no-daemon --stacktrace

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check the Android module
        run: ./gradlew :android:check :android:assembleDebug --no-daemon --stacktrace

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e


  image:
    name: image (${{ matrix.surface }})
    needs: [server, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        surface: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.surface }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.surface }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # Asks the deploy repository to run the published image. Skipped until the token is set.
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.VPS_INFRA_DISPATCH_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.surface }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::VPS_INFRA_DISPATCH_TOKEN is not set; $IMAGE is published but not deployed"
            exit 0
          fi
          gh api repos/vjgarciag96/vps-infra/dispatches \
            -f event_type=image-published \
            -f "client_payload[image]=$IMAGE" \
            -f "client_payload[tag]=$GITHUB_SHA"
